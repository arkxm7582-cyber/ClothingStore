<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Loom - Shirts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Aura Loom</h1>
            <p>Your style, your aura.</p>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="header-icons">
            <a href="wishlist.html" class="wishlist-icon">💖</a>

    </header>

    <main>
        <section class="category-products">
            <h2>Shirts Collection</h2>
            <div class="products-container">
                <!-- Example product item -->
                <div class="product-card">
                    <img src="images/shirt1.jpg" alt="Shirt 1">
                    <h3>Men's Casual Shirt</h3>
                    <p>$35.00</p>
                    <button>Add to Cart</button>
                </div>

                <div class="product-card">
                    <img src="images/shirt2.jpg" alt="Shirt 2">
                    <h3>Formal Button-Down Shirt</h3>
                    <p>$45.00</p>
                    <button>Add to Cart</button>
                </div>

                <div class="product-card">
                    <img src="images/shirt3.jpg" alt="Shirt 3">
                    <h3>Checkered Shirt</h3>
                    <p>$40.00</p>
                    <button>Add to Cart</button>
                </div>
                <!-- Add more products as needed -->
            </div>

    <script src="script.js"></script>
